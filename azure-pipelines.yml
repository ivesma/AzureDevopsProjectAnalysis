# Builds the standalone azdo-analyse executable for the operating systems selected at queue time.
# CI / PR / tag runs use the parameter defaults (all platforms).

trigger:
  branches:
    include: [main]
  tags:
    include: ["v*"]

pr:
  branches:
    include: [main]

parameters:
  - name: buildWindows
    displayName: Windows (x64)
    type: boolean
    default: true
  - name: buildLinux
    displayName: Linux (x64)
    type: boolean
    default: true
  - name: buildMacOS
    displayName: macOS (x64)
    type: boolean
    default: true
  - name: runSmokeTest
    displayName: Run --demo smoke test
    type: boolean
    default: true

variables:
  pythonVersion: "3.12"

jobs:
  - ${{ if eq(parameters.buildWindows, true) }}:
      - template: .azure-pipelines/build-job.yml
        parameters:
          name: windows_x64
          vmImage: windows-latest
          pythonVersion: $(pythonVersion)
          runSmokeTest: ${{ parameters.runSmokeTest }}

  - ${{ if eq(parameters.buildLinux, true) }}:
      - template: .azure-pipelines/build-job.yml
        parameters:
          name: linux_x64
          vmImage: ubuntu-22.04 # older glibc => binary runs on more distros
          pythonVersion: $(pythonVersion)
          runSmokeTest: ${{ parameters.runSmokeTest }}

  - ${{ if eq(parameters.buildMacOS, true) }}:
      - template: .azure-pipelines/build-job.yml
        parameters:
          name: macos_x64
          vmImage: macOS-14
          pythonVersion: $(pythonVersion)
          runSmokeTest: ${{ parameters.runSmokeTest }}

  - ${{ if not(or(parameters.buildWindows, parameters.buildLinux, parameters.buildMacOS)) }}:
      - job: nothing_selected
        displayName: No operating system selected
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: none
          - script: |
              echo "##vso[task.logissue type=error]Select at least one operating system to build."
              exit 1
            displayName: Fail
