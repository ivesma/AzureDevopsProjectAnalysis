[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azdo-analyser"
version = "0.1.0"
description = "Comprehensive discovery, analysis, documentation and visualisation of Azure DevOps projects."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ivesma" }]
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "Jinja2>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
azdo-analyse = "azdo_analyser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
azdo_analyser = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["azdo_analyser"]
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
